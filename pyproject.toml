[tool.setuptools.packages.find]
where = ["."]
include = ["pipelines*", "shared*"]

[project]
name = "inex-pipelines"
version = "0.1.0"
description = "ETL pipelines for INEP higher-education microdata"
requires-python = ">=3.11"

dependencies = [
    "polars==1.30.0",
    "pyarrow>=14.0.0",
    "duckdb>=1.0.0",
    "pyyaml>=6.0",
    "click==8.1.8",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.1.0",
    "ruff==0.11.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
